name: Build HarmonyOS HAP

# HarmonyOS NEXT 不兼容 Android APK，必须用 hvigorw + HarmonyOS SDK 才能打 HAP。
# HarmonyOS SDK 不公开分发，GitHub 官方 runner 上没有，所以走带 SDK 的自托管 runner。
#
# 路线（2026-11-17 在本地实测验证过，见 release-manifests/构建与发布.md 第 9 节）：
#   自托管 runner 预装华为官方 Command Line Tools（内嵌 SDK）→ 设 DEVECO_SDK_HOME →
#   把工程复制到纯 ASCII 路径（hvigor 拒绝中文路径）→ 用 CLI 自带的 hvigorw 构建 → 上传 HAP。
#
# 两种用法：
#   1. 自托管 runner（标签 harmony-sdk，runner 机器上已装 Command Line Tools）——推荐；
#   2. 自托管 runner 上已构建好 HAP 时，用 workflow_dispatch 的 hap_path 走 upload-only 直接上传
#      （hap_path 是 runner 本机路径，托管 runner 上取不到）。

on:
  push:
    tags: ['v*']
    # GitHub 要求 tags 与 paths 同时满足才触发。以前列了 paths，结果发版 tag 指向的
    # commit 没碰到 harmony/**/src/** 时整条 workflow 不跑，Release 里就少了 HAP。
    # 发版 tag 一律构建，不要 paths 限制。
  workflow_dispatch:
    inputs:
      tag:
        description: '上传到哪个 Release tag'
        required: true
        type: string
      hap_path:
        description: '（仅 upload-only 模式）本地已构建 HAP 的路径'
        required: false
        type: string

permissions:
  contents: write

env:
  # Command Line Tools 在自托管 runner 上的解压目录。
  # runner 机器上解压到该路径即可（解压后的目录名是 command-line-tools）。
  CLI_ROOT: /opt/harmony-cli/command-line-tools
  # 构建用的纯 ASCII 工程目录：hvigor 拒绝含中文/非 ASCII 字符的工程路径。
  BUILD_DIR: /opt/harmony-build

jobs:
  # 模式 A：在带 Command Line Tools 的自托管 runner 上完整构建
  build-with-sdk:
    if: github.event_name == 'push' || inputs.hap_path == ''
    runs-on: [self-hosted, harmony-sdk]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Command Line Tools
        run: |
          set -euo pipefail
          if [ ! -x "$CLI_ROOT/hvigor/bin/hvigorw" ]; then
            echo "::error::未找到 $CLI_ROOT/hvigor/bin/hvigorw —— 自托管 runner 需要预装华为 Command Line Tools"
            exit 1
          fi
          "$CLI_ROOT/hvigor/bin/hvigorw" --version

      # 工程必须复制到纯 ASCII 路径；同时排除 rawfile/dist（前端产物由 sync 步骤重新生成）。
      - name: Copy project to ASCII path
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          cp -R harmony/folia/. "$BUILD_DIR/"
          rm -rf "$BUILD_DIR/entry/src/main/resources/rawfile/dist"
          rm -rf "$BUILD_DIR/.hvigor" "$BUILD_DIR/entry/build" "$BUILD_DIR/build"

      - name: Sync web assets into rawfile
        working-directory: harmony/folia
        run: bash scripts/sync-web-assets.sh

      - name: Copy synced assets into build dir
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/entry/src/main/resources/rawfile"
          cp -R harmony/folia/entry/src/main/resources/rawfile/dist "$BUILD_DIR/entry/src/main/resources/rawfile/dist"
          cp harmony/folia/entry/src/main/resources/rawfile/capacitor-harmony-bridge.js \
             "$BUILD_DIR/entry/src/main/resources/rawfile/capacitor-harmony-bridge.js"

      - name: Build HAP with Command Line Tools hvigorw
        working-directory: /opt/harmony-build
        env:
          NODE_HOME: ${{ env.NODE_HOME }}
          DEVECO_SDK_HOME: /opt/harmony-cli/command-line-tools/sdk
          JAVA_HOME: /opt/harmony-cli/command-line-tools/tool/jre
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          "$CLI_ROOT/hvigor/bin/hvigorw" assembleHap --mode module -p product=default --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/harmony-out"
          find . -name '*.hap' -type f -exec cp {} "$GITHUB_WORKSPACE/harmony-out/" \;
          ls -la "$GITHUB_WORKSPACE/harmony-out/"

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload HAP to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          shopt -s nullglob
          files=(harmony-out/*.hap)
          [ ${#files[@]} -gt 0 ] || { echo "没有 HAP 产物" >&2; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || {
            # x64/arm64/Harmony 并发跑时可能同时判定「不存在」：create 失败的一方
            # 再 view 一次确认对方已经建好了，不把整个 job 弄红。
            gh release create "$TAG" --title "Folia $TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "无法创建或找到 Release $TAG" >&2; exit 1; }
          }
          for f in "${files[@]}"; do gh release upload "$TAG" "$f" --clobber; done

  # 模式 B：runner 上已构建好 HAP，只做上传。
  # hap_path 是**runner 本机路径**，所以必须跑在装了 SDK 的自托管 runner 上 ——
  # 托管 runner 上这个文件永远不存在，原来的 download-artifact pattern:none 也取不到它。
  upload-only:
    if: github.event_name == 'workflow_dispatch' && inputs.hap_path != ''
    runs-on: [self-hosted, harmony-sdk]
    steps:
      - name: Upload HAP to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          HAP_PATH: ${{ inputs.hap_path }}
        run: |
          shopt -s nullglob
          if [ -f "$HAP_PATH" ]; then
            cp "$HAP_PATH" harmony-out/
          fi
          files=(harmony-out/*.hap)
          [ ${#files[@]} -gt 0 ] || { echo "没有 HAP 产物（检查 inputs.hap_path）" >&2; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || {
            # x64/arm64/Harmony 并发跑时可能同时判定「不存在」：create 失败的一方
            # 再 view 一次确认对方已经建好了，不把整个 job 弄红。
            gh release create "$TAG" --title "Folia $TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "无法创建或找到 Release $TAG" >&2; exit 1; }
          }
          for f in "${files[@]}"; do gh release upload "$TAG" "$f" --clobber; done
