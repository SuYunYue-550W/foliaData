name: Build Linux packages

# Linux 包必须在真正的 Linux runner 上构建：MNN 运行时是从 pin 住的 commit 用 CMake+gcc
# 编出来的，build/buildMnnRuntime.mjs 明确拒绝在别的平台交叉编译（要求 arch === process.arch）。
# 因此 x64 用 ubuntu-24.04、arm64 用 GitHub 免费的 ubuntu-24.04-arm，各自本机编译，不能交叉。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传到的 Release tag（留空则用当前分支版本 vX.Y.Z）'
        required: false
        type: string
      targets:
        description: 'electron-builder 目标，逗号分隔'
        required: false
        default: 'tar.gz,deb,rpm,AppImage'
        type: string
      arch:
        description: '构建哪种架构（push 标签时忽略，始终 both）'
        required: false
        default: 'both'
        type: choice
        options: [both, x64, arm64]

permissions:
  contents: write

# 不用 concurrency：x64 / arm64 两个 job 属同一次 run，若共用带 cancel-in-progress 的
# group 会互相取消。重复触发由 GitHub 自己排队即可。

jobs:
  # push 标签 → inputs.arch 为空 → 表达式 `inputs.arch == ''` 为真 → 两个架构都跑。
  # workflow_dispatch → 按选择只跑对应架构。
  build-x64:
    if: ${{ github.event_name == 'push' || inputs.arch == 'both' || inputs.arch == 'x64' || inputs.arch == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Folia-源码-完整版/package-lock.json

      - name: Build Linux packages (x64)
        env:
          TARGETS: ${{ inputs.targets || 'tar.gz,deb,rpm,AppImage' }}
          ARCH: x64
          SKIP_DEPS: '0'
        run: bash scripts/build-linux.sh

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          version="$(node -p "require('./Folia-源码-完整版/package.json').version")"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v$version"; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "[Linux x64] Release tag: $tag"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-linux-*/*.tar.gz release-linux-*/*.deb release-linux-*/*.rpm release-linux-*/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "没有找到 x64 安装包" >&2; exit 1; fi
          gh release view "$TAG" >/dev/null 2>&1 || {
            # x64/arm64/Harmony 并发跑时可能同时判定「不存在」：create 失败的一方
            # 再 view 一次确认对方已经建好了，不把整个 job 弄红。
            gh release create "$TAG" --title "Folia $TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "无法创建或找到 Release $TAG" >&2; exit 1; }
          }
          for file in "${files[@]}"; do
            echo "上传 $file ($(stat -c%s "$file") B)"
            gh release upload "$TAG" "$file" --clobber
          done
          echo "x64 已上传到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

  build-arm64:
    if: ${{ github.event_name == 'push' || inputs.arch == 'both' || inputs.arch == 'arm64' || inputs.arch == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Folia-源码-完整版/package-lock.json

      - name: Build Linux packages (arm64)
        env:
          TARGETS: ${{ inputs.targets || 'tar.gz,deb,rpm,AppImage' }}
          ARCH: arm64
          SKIP_DEPS: '0'
        run: bash scripts/build-linux.sh

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          version="$(node -p "require('./Folia-源码-完整版/package.json').version")"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v$version"; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "[Linux arm64] Release tag: $tag"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-linux-*/*.tar.gz release-linux-*/*.deb release-linux-*/*.rpm release-linux-*/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "没有找到 arm64 安装包" >&2; exit 1; fi
          gh release view "$TAG" >/dev/null 2>&1 || {
            # x64/arm64/Harmony 并发跑时可能同时判定「不存在」：create 失败的一方
            # 再 view 一次确认对方已经建好了，不把整个 job 弄红。
            gh release create "$TAG" --title "Folia $TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "无法创建或找到 Release $TAG" >&2; exit 1; }
          }
          for file in "${files[@]}"; do
            echo "上传 $file ($(stat -c%s "$file") B)"
            gh release upload "$TAG" "$file" --clobber
          done
          echo "arm64 已上传到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
